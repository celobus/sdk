[package]
name = "celobus-sdk"
description = "The Celobus plugin SDK for Rust: declarations, the JSON codec, the platform session and --describe"
version = "0.3.0"
edition.workspace = true
authors = ["Celobus"]
license-file = "LICENSE"
homepage = "https://celobus.com"
repository = "https://github.com/celobus/sdk"
readme = "README.md"
keywords = ["celobus", "plugin", "sdk", "grpc"]
categories = ["api-bindings", "development-tools"]

[dependencies]
celobus-proto.workspace = true
celobus-descriptor.workspace = true
celobus-sdk-derive.workspace = true
tonic.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
hyper-util.workspace = true
futures.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
