[package]
name = "celobus-sdk-derive"
description = "Derive macros of the Celobus plugin SDK: Message and Entity"
version = "0.3.0"
edition.workspace = true
authors = ["Celobus"]
license-file = "LICENSE"
homepage = "https://celobus.com"
repository = "https://github.com/celobus/sdk"
readme = "README.md"
keywords = ["celobus", "plugin", "sdk", "derive"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
