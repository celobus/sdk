[package]
name = "celobus-descriptor"
description = "The Celobus plugin descriptor: schema, canonical JSON, validation and the derived manifest"
version = "0.1.1"
edition.workspace = true
authors = ["Celobus"]
license-file = "LICENSE"
homepage = "https://celobus.com"
repository = "https://github.com/celobus/sdk"
readme = "README.md"
keywords = ["celobus", "plugin", "descriptor", "validation"]
categories = ["api-bindings", "development-tools"]

[dependencies]
celobus-manifest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_path_to_error = "0.1"
semver = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
