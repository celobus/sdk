[workspace]
resolver = "3"
members = [
  "crates/proto",
  "crates/manifest",
  "crates/descriptor",
  "crates/sdk-derive",
  "crates/sdk",
  "sdk/conformance/hello/rust",
  "sdk/conformance/shop/rust",
  "sdk/conformance/notify/rust",
  "sdk/conformance/jobs/rust",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
protox = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
celobus-proto = { path = "crates/proto", version = "0.1.0" }
celobus-manifest = { path = "crates/manifest", version = "0.1.0" }
celobus-descriptor = { path = "crates/descriptor", version = "0.1.0" }
celobus-sdk-derive = { path = "crates/sdk-derive", version = "0.1.0" }
celobus-sdk = { path = "crates/sdk", version = "0.1.0" }
