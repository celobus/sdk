[package]
name = "celobus-manifest"
description = "The Celobus plugin manifest: roles, scopes, agents, requirements and its digest"
version = "0.3.0"
edition.workspace = true
authors = ["Celobus"]
license-file = "LICENSE"
homepage = "https://celobus.com"
repository = "https://github.com/celobus/sdk"
readme = "README.md"
keywords = ["celobus", "plugin", "manifest"]
categories = ["api-bindings"]

[dependencies]
celobus-proto.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
