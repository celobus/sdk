# Build, test and pack the SDKs; publish them only when asked.
#
# A tag v* or a manual run builds: the Rust tests, the TypeScript and C# tests, the conformance of the three SDKs,
# then the packages (the five crates, @celobus/sdk, Celobus.Sdk) uploaded as the artifact `packages`. Nothing is
# published on this path.
#
# Publishing is a manual run with the input `publish` set to true, in a repository whose variable PUBLISH_ENABLED is
# 'true', approved through the environment `release`. It publishes the crates in dependency order, the npm package and
# the NuGet package of the commit it runs on (version 0.1.0 and so on, as written in the packages). All three
# registries trust this workflow and the environment `release` (trusted publishing): the run trades its OIDC token
# for a short-lived one, and the repository holds no registry token.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io, npm and NuGet (also needs vars.PUBLISH_ENABLED == 'true')"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CRATES: celobus-proto celobus-manifest celobus-descriptor celobus-sdk-derive celobus-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: The tag names the packages' version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # a release candidate (v0.1.0-rc.1) carries the packages of its release (0.1.0)
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%%-*}
          rust=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "celobus-sdk") | .version')
          node=$(jq -r .version sdk/node/package.json)
          dotnet=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' sdk/dotnet/Celobus.Sdk/Celobus.Sdk.csproj)
          echo "tag $tag, celobus-sdk $rust, @celobus/sdk $node, Celobus.Sdk $dotnet"
          [[ "$rust" == "$tag" && "$node" == "$tag" && "$dotnet" == "$tag" ]]

      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Conformance (Rust, TypeScript, C#)
        run: ./scripts/sdk-conformance.sh
      - name: TypeScript tests
        working-directory: sdk/node
        run: npm ci && npm run build && npm test
      - name: C# tests
        run: dotnet test sdk/dotnet

      - name: Pack
        run: |
          mkdir -p packages
          # each crate is built from its packaged form; the crates it depends on come from this run's packages
          cargo package --locked $(printf -- '-p %s ' $CRATES)
          for c in $CRATES; do cp target/package/$c-*.crate packages/; done
          (cd sdk/node && npm pack --pack-destination ../../packages)
          dotnet pack sdk/dotnet/Celobus.Sdk -c Release -o packages -p:ContinuousIntegrationBuild=true
          ls -l packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # crates.io: trusted publishing, configured on each crate for this repository, workflow and environment; the
      # action's own post step revokes the token at the end of the job
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io
      - name: crates.io (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: |
          # cargo publish waits until each crate is in the index before the next one, which depends on it; a version
          # already on crates.io is left as it is, so a run can be repeated after a later step failed
          for c in $CRATES; do
            v=$(cargo metadata --format-version 1 --no-deps --locked | jq -r --arg c "$c" '.packages[] | select(.name == $c) | .version')
            if curl -fsS -o /dev/null -A "celobus-sdk-publish (https://github.com/celobus/sdk)" "https://crates.io/api/v1/crates/$c/$v"; then
              echo "$c $v is on crates.io already"
              continue
            fi
            cargo publish --locked -p "$c"
          done

      # npm: trusted publishing, configured on the package for this repository, workflow and environment. npm publish
      # trades the run's OIDC token itself (npm 11.5.1 or later) and adds the provenance; no token, no .npmrc.
      - name: npm
        run: |
          npm install -g npm@11.21.3
          # a path, not packages/<name>: npm would read that as a GitHub repository
          tgz=$(ls ./packages/celobus-sdk-*.tgz)
          v=$(jq -r .version sdk/node/package.json)
          if npm view "@celobus/sdk@$v" version >/dev/null 2>&1; then
            echo "@celobus/sdk $v is on npm already"
          else
            npm publish "$tgz" --provenance --access public
          fi

      # NuGet: trusted publishing (a policy on nuget.org for this repository and workflow, owned by the nuget.org user in the secret NUGET_USER)
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: NuGet
        run: >-
          dotnet nuget push packages/*.nupkg
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
