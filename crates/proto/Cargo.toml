[package]
name = "celobus-proto"
description = "The Celobus plugin contract: protobuf messages and gRPC services of plugin.proto, generated with tonic"
version = "0.1.2"
edition.workspace = true
authors = ["Celobus"]
license-file = "LICENSE"
homepage = "https://celobus.com"
repository = "https://github.com/celobus/sdk"
readme = "README.md"
keywords = ["celobus", "plugin", "protobuf", "grpc"]
categories = ["api-bindings"]

[dependencies]
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true
