[package]
name = "celobus-conformance-jobs"
description = "The SDK conformance plugin `jobsdemo` in Rust: its --describe must equal ../descriptor.json"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "jobsdemo"
path = "src/main.rs"

[dependencies]
celobus-sdk.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
celobus-proto.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio-stream.workspace = true
tonic.workspace = true
